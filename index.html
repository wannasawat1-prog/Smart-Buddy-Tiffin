<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ปิ่นโตคู่คิด (Smart Buddy Tiffin)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap');

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f0f7f4;
            color: #333;
            margin: 0;
            padding: 20px;
            padding-bottom: 120px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .banner-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .content-area { padding: 25px; }

        h1 { text-align: center; color: #1b5e20; margin: 10px 0; }
        
        .instruction {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
            background: #e8f5e9;
            padding: 15px;
            border-radius: 10px;
            border: 1px dashed #4CAF50;
        }

        /* Meal Sections */
        .meal-section {
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            margin-bottom: 25px;
            overflow: hidden;
            background: #fff;
            position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        
        .meal-section.morning { border-left: 6px solid #ffb74d; }
        .meal-section.noon { border-left: 6px solid #ef5350; }
        .meal-section.snack { border-left: 6px solid #ab47bc; background-color: #fcf3ff; }
        .meal-section.evening { border-left: 6px solid #5c6bc0; }

        .meal-header {
            background-color: #f9f9f9;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-left { flex-grow: 1; display: flex; flex-direction: column; gap: 5px;}
        .meal-title { font-weight: bold; font-size: 1.25em; color: #333; }

        .input-group {
            display: flex;
            gap: 5px;
            width: 100%;
            max-width: 450px;
        }

        input.menu-input {
            flex-grow: 1;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-family: 'Sarabun', sans-serif;
            font-size: 1em;
            outline: none;
            transition: all 0.3s;
        }
        input.menu-input:focus { border-color: #4CAF50; box-shadow: 0 0 5px rgba(76,175,80,0.2); }

        button.search-btn {
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0 15px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
        }
        
        button.mic-btn {
            background: #ffffff;
            color: #555;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 0 12px;
            cursor: pointer;
            font-size: 1.2em;
            transition: all 0.2s;
        }
        button.mic-btn:hover { background-color: #f0f0f0; }
        button.mic-btn.listening {
            color: #d32f2f;
            border-color: #d32f2f;
            background-color: #ffebee;
            animation: micPulse 1.5s infinite;
        }
        @keyframes micPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .auto-read-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Sarabun', sans-serif;
            font-size: 0.9em;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: background 0.3s;
        }
        .auto-read-btn:hover { background-color: #388e3c; }
        .auto-read-btn.playing { background-color: #e53935; animation: pulse 1.5s infinite; }

        .meal-cal-badge {
            background: #fff;
            color: #2e7d32;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 1em;
            font-weight: bold;
            border: 1px solid #c8e6c9;
            white-space: nowrap;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        td, th { padding: 12px 15px; text-align: left; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
        th { width: 25%; font-size: 0.9em; color: #666; vertical-align: top; padding-top: 18px;}

        .ingredient-cell { display: flex; align-items: center; }
        .ing-img { width: 48px; height: 48px; border-radius: 8px; margin-right: 15px; border: 1px solid #eee; object-fit: cover;}
        
        .g-tag { display: inline-block; font-weight: bold; margin-bottom: 4px; font-size: 0.85em; padding: 2px 8px; border-radius: 4px; color: white;}
        .bg-p { background-color: #d32f2f; } .bg-c { background-color: #795548; } .bg-m { background-color: #2e7d32; } .bg-v { background-color: #f57f17; } .bg-f { background-color: #0288d1; }

        .quantity { font-weight: 600; color: #333; background: #fff; padding: 4px 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 0.9em; }

        .total-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #263238;
            color: white;
            padding: 15px;
            text-align: center;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.2);
            z-index: 100;
        }
        .total-val { font-size: 1.5em; font-weight: bold; color: #66bb6a; }

        tr.clickable-row { transition: background-color 0.3s; cursor: pointer; }
        tr.clickable-row:hover { background-color: #f5f5f5; }
        tr.speaking { background-color: #c8e6c9 !important; border-left: 5px solid #2e7d32; }

        @media (max-width: 600px) {
            .meal-header { flex-direction: column; align-items: stretch; }
            .input-group { max-width: 100%; }
            .auto-read-btn { width: 100%; justify-content: center; margin-top: 10px;}
        }
    </style>
</head>

    window.onload = function() {
        populateDatalist();
        createMealSections();
        
        // Default meals
        document.getElementById('input-morning').value = "ข้าวต้มปลา";
        document.getElementById('input-noon').value = "ข้าวกะเพราไก่";
        document.getElementById('input-snack').value = "ชุดผลไม้รวม";
        document.getElementById('input-evening').value = "แกงจืดเต้าหู้หมูสับ";
        
        // Render initial but DO NOT auto speak on load
        renderAllMeals();
        loadVoices();
    };

    function populateDatalist() {
        const dataList = document.getElementById('menu-list');
        Object.keys(recipes).sort().forEach(key => {
            let option = document.createElement('option');
            option.value = key;
            dataList.appendChild(option);
        });
    }

    function createMealSections() {
        const container = document.getElementById('meal-sections-container');
        const sections = [
            { id: 'morning', title: '🌅 มื้อเช้า', color: 'morning' },
            { id: 'noon', title: '☀️ มื้อกลางวัน', color: 'noon' },
            { id: 'snack', title: '🍵 อาหารว่าง', color: 'snack' },
            { id: 'evening', title: '🌙 มื้อเย็น', color: 'evening' }
        ];

        sections.forEach(sec => {
            const html = `
                <div class="meal-section ${sec.color}">
                    <div class="meal-header">
                        <div class="header-left">
                            <div class="meal-title">${sec.title}</div>
                            <div class="input-group">
                                <input type="text" id="input-${sec.id}" class="menu-input" list="menu-list" placeholder="พิมพ์ชื่อเมนู..." onchange="processMenu('${sec.id}', true)">
                                <button class="mic-btn" id="btn-mic-${sec.id}" onclick="startListening('${sec.id}')">🎤</button>
                                <button class="search-btn" onclick="processMenu('${sec.id}', true)">🔍</button>
                            </div>
                        </div>
                        <div style="display: flex; gap:10px; align-items: center; justify-content: space-between;">
                            <div class="meal-cal-badge">พลังงาน: <span id="cal-${sec.id}">0</span> kcal</div>
                            <button class="auto-read-btn" id="btn-${sec.id}" onclick="readEntireMeal('${sec.id}')">🔊 ฟัง</button>
                        </div>
                    </div>
                    <table id="table-${sec.id}"></table>
                </div>
            `;
            container.innerHTML += html;
        });
    }

    // --- Voice Recognition Logic ---
    function startListening(mealId) {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            alert("เบราว์เซอร์นี้ไม่รองรับการสั่งงานด้วยเสียง (แนะนำ Google Chrome)");
            return;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'th-TH';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        const btn = document.getElementById(`btn-mic-${mealId}`);
        btn.classList.add('listening');

        recognition.start();

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            const inputField = document.getElementById(`input-${mealId}`);
            inputField.value = transcript;
            
            // Auto Speak is TRUE because it came from voice interaction
            processMenu(mealId, true);
            
            btn.classList.remove('listening');
        };

        recognition.onend = () => { btn.classList.remove('listening'); };
        recognition.onerror = (event) => { console.error(event.error); btn.classList.remove('listening'); };
    }

    // --- Processing Logic with Auto-Speak Trigger ---
    function processMenu(mealType, autoSpeak = false) {
        let input = document.getElementById(`input-${mealType}`).value.trim();
        let ingredients = [];

        }
        renderTable(mealType, ingredients);

        // *** Auto Speak Logic ***
        if (autoSpeak) {
            // Wait slightly for UI update then speak
            setTimeout(() => {
                readEntireMeal(mealType);
            }, 500);
        }
    }

    function renderTable(mealType, ingredients) {
        const table = document.getElementById(`table-${mealType}`);
        table.innerHTML = "";
        let mealCal = 0;

        ingredients.forEach(ing => {
            if (ing.name === "-") return;
            mealCal += ing.cal;
            
            let badgeClass = "", groupName = "";
            switch(ing.group) {
                case 1: badgeClass="bg-p"; groupName="1.โปรตีน"; break;
                case 2: badgeClass="bg-c"; groupName="2.คาร์โบฯ"; break;
                case 3: badgeClass="bg-m"; groupName="3.เกลือแร่"; break;
                case 4: badgeClass="bg-v"; groupName="4.วิตามิน"; break;
                case 5: badgeClass="bg-f"; groupName="5.ไขมัน"; break;
            }

            let speakText = `หมู่ ${ing.group} ... ${ing.name} ... ปริมาณ ${ing.qty}`;

            let row = `
                <tr class="clickable-row" data-speak="${speakText}">
                    <th><span class="g-tag ${badgeClass}">${groupName}</span></th>
                    <td class="ingredient-cell">
                        <img src="https://placehold.co/48x48/${getHexColor(ing.group)}/ffffff?text=${ing.img}" class="ing-img">
                        ${ing.name}
                    </td>
                    <td><span class="quantity">${ing.qty}</span></td>
                </tr>
            `;
            table.innerHTML += row;
        });

        document.getElementById(`cal-${mealType}`).innerText = mealCal;
        updateGrandTotal();
    }

    function renderAllMeals() {
        // Initial load does NOT auto speak
        processMenu('morning', false); 
        processMenu('noon', false); 
        processMenu('snack', false); 
        processMenu('evening', false);
    }

    function updateGrandTotal() {
        let total = 0;
        ['morning', 'noon', 'snack', 'evening'].forEach(m => {
            total += parseInt(document.getElementById(`cal-${m}`).innerText);
        });
        let totalEl = document.getElementById('total-kcal');
        totalEl.innerText = total;

        if (total >= 1200 && total <= 1800) totalEl.style.color = "#66bb6a";
        else if (total < 1200) totalEl.style.color = "#ffa726";
        else totalEl.style.color = "#ef5350";
    }
    
    function getHexColor(group) {
        const colors = ["", "d32f2f", "795548", "2e7d32", "fbc02d", "0288d1"];
        return colors[group] || "999999";
    }

    // --- Voice Output Logic (TTS) ---
    let thaiFemaleVoice = null;
    let currentSpeakingMeal = null;

    function loadVoices() {
        const voices = window.speechSynthesis.getVoices();
        const thaiVoices = voices.filter(voice => voice.lang.includes('th'));
        if (thaiVoices.length > 0) {
            thaiFemaleVoice = thaiVoices.find(voice => 
                voice.name.includes('Narisa') || voice.name.includes('Kanya') || voice.name.includes('Google') || voice.name.toLowerCase().includes('female')
            );
            if (!thaiFemaleVoice) thaiFemaleVoice = thaiVoices[0];
        }
    }
    window.speechSynthesis.onvoiceschanged = loadVoices;

    function stopReading() {
        window.speechSynthesis.cancel();
        document.querySelectorAll('.auto-read-btn').forEach(btn => {
            btn.classList.remove('playing');
            btn.innerText = "🔊 ฟัง";
        });
        document.querySelectorAll('.clickable-row').forEach(row => row.classList.remove('speaking'));
        currentSpeakingMeal = null;
    }

    function readEntireMeal(mealType) {
        // If clicking button manually while reading -> stop
        if (currentSpeakingMeal === mealType) {
            stopReading();
            return;
        }
        stopReading();
        currentSpeakingMeal = mealType;

        const btn = document.getElementById(`btn-${mealType}`);
        btn.classList.add('playing');
        btn.innerText = "⏹ หยุด";

        const menuName = document.getElementById(`input-${mealType}`).value || "เมนูนี้";
        const cal = document.getElementById(`cal-${mealType}`).innerText;
        const rows = document.querySelectorAll(`#table-${mealType} tr`);
        
        let speechQueue = [];
        speechQueue.push({
            text: `เมนู ${menuName} ... พลังงาน ${cal} กิโลแคลอรี่ ... วัตถุดิบคือ`,
            rowElement: null
        });

        rows.forEach(row => {
            speechQueue.push({
                text: row.getAttribute('data-speak'),
                rowElement: row
            });
        });

        speakNextItem(speechQueue, 0, mealType);
    }

    function speakNextItem(queue, index, mealType) {
        if (currentSpeakingMeal !== mealType) return;
        if (index >= queue.length) {
            stopReading();
            return;
        }

        const item = queue[index];
        if (item.rowElement) {
            item.rowElement.classList.add('speaking');
            item.rowElement.scrollIntoView({behavior: "smooth", block: "center"});
        }

        const utterance = new SpeechSynthesisUtterance(item.text);
        utterance.lang = 'th-TH';
        if (thaiFemaleVoice) utterance.voice = thaiFemaleVoice;
        utterance.rate = 0.9;
        utterance.pitch = 1.1;

        utterance.onend = function() {
            if (item.rowElement) {
                item.rowElement.classList.remove('speaking');
            }
            speakNextItem(queue, index + 1, mealType);
        };
        
        utterance.onerror = function() { stopReading(); };

        window.speechSynthesis.speak(utterance);
    }
</script>
